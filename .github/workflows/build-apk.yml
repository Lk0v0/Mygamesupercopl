name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Custom Android App Icons
        run: |
          RES_DIR="android/app/src/main/res"
          if [ -f "assets/icon-only.png" ]; then
            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi
            declare -A SIZES=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
            declare -A FG_SIZES=( ["mdpi"]=108 ["hdpi"]=162 ["xhdpi"]=216 ["xxhdpi"]=324 ["xxxhdpi"]=432 )
            for dpi in "${!SIZES[@]}"; do
              sz="${SIZES[$dpi]}"
              fgsz="${FG_SIZES[$dpi]}"
              mkdir -p "$RES_DIR/mipmap-$dpi"
              convert assets/icon-only.png -resize "${sz}x${sz}" "$RES_DIR/mipmap-$dpi/ic_launcher.png"
              convert assets/icon-only.png -resize "${sz}x${sz}" \
                \( -size "${sz}x${sz}" xc:none -fill white -draw "circle $((sz/2)),$((sz/2)) $((sz/2)),0" \) \
                -compose CopyOpacity -composite "$RES_DIR/mipmap-$dpi/ic_launcher_round.png"
              convert assets/icon-foreground.png -resize "${fgsz}x${fgsz}" "$RES_DIR/mipmap-$dpi/ic_launcher_foreground.png"
            done
            mkdir -p "$RES_DIR/values"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#020617</color>\n</resources>\n' > "$RES_DIR/values/ic_launcher_background.xml"
          fi

      - name: Copy Release Keystore
        run: |
          mkdir -p android/app
          cp keystore/release.keystore android/app/release.keystore

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Distribution
        run: |
          mkdir -p dist-apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/ZombieShooter2-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Shooter-2-APK
          path: dist-apk/*.apk
          if-no-files-found: error
