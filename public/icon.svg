<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Tactical Ring -->
  <circle cx="256" cy="256" r="185" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="150" stroke="#f43f5e" stroke-opacity="0.45" stroke-width="6" />

  <!-- Minimalist Crosshair Accents -->
  <line x1="256" y1="48" x2="256" y2="92" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="420" x2="256" y2="464" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="48" y1="256" x2="92" y2="256" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="420" y1="256" x2="464" y2="256" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

  <!-- Center ZS2 Minimalist Typography Badge -->
  <g filter="url(#glow)">
    <text x="256" y="285" 
          font-family="system-ui, -apple-system, 'Chakra Petch', 'Outfit', sans-serif" 
          font-weight="900" 
          font-size="136" 
          letter-spacing="-2"
          text-anchor="middle" 
          fill="url(#textGrad)">ZS2</text>
  </g>

  <!-- Inner Reticle Dot -->
  <circle cx="256" cy="335" r="7" fill="#f43f5e" />
</svg>
